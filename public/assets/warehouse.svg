<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Warehouse dock scene with shelves, parcels and a forklift lane">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF3C7"/><stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#sky)"/>
  <circle cx="540" cy="64" r="34" fill="#F59E0B" opacity="0.85"/>
  <circle cx="540" cy="64" r="48" fill="#F59E0B" opacity="0.18"/>
  <!-- building -->
  <g>
    <rect x="70" y="110" width="500" height="180" rx="8" fill="#292524"/>
    <polygon points="50,118 320,52 590,118" fill="#E8590C"/>
    <polygon points="50,118 320,52 590,118" fill="none" stroke="#9A3412" stroke-width="3"/>
    <rect x="86" y="130" width="468" height="160" rx="4" fill="#44403C"/>
    <!-- dock doors -->
    <g>
      <rect x="110" y="168" width="90" height="122" rx="4" fill="#E7E0D2"/>
      <line x1="110" y1="192" x2="200" y2="192" stroke="#A8A29E" stroke-width="3"/>
      <line x1="110" y1="216" x2="200" y2="216" stroke="#A8A29E" stroke-width="3"/>
      <line x1="110" y1="240" x2="200" y2="240" stroke="#A8A29E" stroke-width="3"/>
      <line x1="110" y1="264" x2="200" y2="264" stroke="#A8A29E" stroke-width="3"/>
      <rect x="245" y="168" width="90" height="122" rx="4" fill="#F59E0B"/>
      <line x1="245" y1="192" x2="335" y2="192" stroke="#9A3412" stroke-width="3"/>
      <line x1="245" y1="216" x2="335" y2="216" stroke="#9A3412" stroke-width="3"/>
      <line x1="245" y1="240" x2="335" y2="240" stroke="#9A3412" stroke-width="3"/>
      <line x1="245" y1="264" x2="335" y2="264" stroke="#9A3412" stroke-width="3"/>
      <rect x="380" y="168" width="90" height="122" rx="4" fill="#E7E0D2"/>
      <line x1="380" y1="192" x2="470" y2="192" stroke="#A8A29E" stroke-width="3"/>
      <line x1="380" y1="216" x2="470" y2="216" stroke="#A8A29E" stroke-width="3"/>
      <line x1="380" y1="240" x2="470" y2="240" stroke="#A8A29E" stroke-width="3"/>
      <line x1="380" y1="264" x2="470" y2="264" stroke="#A8A29E" stroke-width="3"/>
    </g>
    <rect x="200" y="88" width="240" height="30" rx="6" fill="#FFF7ED"/>
    <text x="320" y="108" text-anchor="middle" font-family="monospace" font-size="16" font-weight="700" letter-spacing="4" fill="#171410">WAREHOUSE · DOCK 34–35</text>
  </g>
  <!-- ground + lane -->
  <rect x="0" y="290" width="640" height="70" fill="#57534E"/>
  <g fill="#FDE68A"><rect x="40" y="320" width="60" height="8" rx="4"/><rect x="160" y="320" width="60" height="8" rx="4"/><rect x="280" y="320" width="60" height="8" rx="4"/><rect x="400" y="320" width="60" height="8" rx="4"/><rect x="520" y="320" width="60" height="8" rx="4"/></g>
  <!-- parcels -->
  <g>
    <rect x="96" y="262" width="34" height="28" rx="3" fill="#F59E0B" stroke="#9A3412" stroke-width="2"/>
    <rect x="134" y="268" width="26" height="22" rx="3" fill="#E8590C" stroke="#9A3412" stroke-width="2"/>
    <rect x="486" y="262" width="34" height="28" rx="3" fill="#F59E0B" stroke="#9A3412" stroke-width="2"/>
    <rect x="524" y="268" width="26" height="22" rx="3" fill="#E8590C" stroke="#9A3412" stroke-width="2"/>
  </g>
  <!-- route pin -->
  <g transform="translate(320 30)">
    <path d="M0 26 C-14 12 -14 -4 0 -4 C14 -4 14 12 0 26 Z" fill="#E8590C" stroke="#fff" stroke-width="2.5"/>
    <circle r="5" cy="8" fill="#fff"/>
  </g>
</svg>
