<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Delivery truck, side view">
  <defs>
    <linearGradient id="cargo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="1" stop-color="#E8590C"/>
    </linearGradient>
    <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7ED"/><stop offset="1" stop-color="#E7E0D2"/>
    </linearGradient>
  </defs>
  <!-- ground shadow -->
  <ellipse cx="320" cy="232" rx="280" ry="12" fill="#171410" opacity="0.14"/>
  <!-- cargo box -->
  <g>
    <rect x="30" y="52" width="360" height="148" rx="10" fill="url(#cargo)"/>
    <rect x="30" y="52" width="360" height="148" rx="10" fill="none" stroke="#9A3412" stroke-width="3" opacity="0.35"/>
    <line x1="30" y1="86" x2="390" y2="86" stroke="#fff" stroke-width="3" opacity="0.45"/>
    <line x1="30" y1="164" x2="390" y2="164" stroke="#9A3412" stroke-width="3" opacity="0.3"/>
    <line x1="120" y1="52" x2="120" y2="200" stroke="#9A3412" stroke-width="3" opacity="0.25"/>
    <line x1="210" y1="52" x2="210" y2="200" stroke="#9A3412" stroke-width="3" opacity="0.25"/>
    <line x1="300" y1="52" x2="300" y2="200" stroke="#9A3412" stroke-width="3" opacity="0.25"/>
    <!-- parcel label on the cargo -->
    <g>
      <rect x="140" y="102" width="140" height="48" rx="6" fill="#FFF7ED"/>
      <rect x="140" y="102" width="140" height="48" rx="6" fill="none" stroke="#9A3412" stroke-width="2"/>
      <circle cx="162" cy="126" r="10" fill="#E8590C"/>
      <path d="M157 126h10M162 121v10" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <rect x="180" y="114" width="84" height="6" rx="3" fill="#171410"/>
      <rect x="180" y="128" width="60" height="6" rx="3" fill="#78716C"/>
      <rect x="180" y="140" width="72" height="5" rx="2.5" fill="#D6D3D1"/>
    </g>
    <text x="210" y="80" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" letter-spacing="3" fill="#FFF7ED">PT DISPATCH</text>
  </g>
  <!-- chassis -->
  <rect x="30" y="196" width="560" height="14" rx="6" fill="#292524"/>
  <!-- cab -->
  <g>
    <path d="M410 200 V96 Q410 72 436 72 H500 Q540 72 560 104 L590 152 Q604 172 604 200 Z" fill="url(#cab)" stroke="#78716C" stroke-width="3"/>
    <path d="M452 88 H500 Q528 88 544 112 L556 138 H452 Z" fill="#BAE6FD" stroke="#0C4A6E" stroke-width="2.5"/>
    <path d="M566 142 H596 Q600 158 600 176 V200 H566 Z" fill="#BAE6FD" stroke="#0C4A6E" stroke-width="2.5"/>
    <rect x="452" y="152" width="96" height="8" rx="4" fill="#E8590C"/>
    <circle cx="470" cy="182" r="7" fill="#FDE68A"/>
    <rect x="560" y="176" width="34" height="10" rx="5" fill="#292524"/>
    <path d="M410 200 V96 Q410 72 436 72 H452 V200 Z" fill="#E8590C" opacity="0.9"/>
  </g>
  <!-- exhaust + bumper -->
  <rect x="596" y="196" width="18" height="22" rx="4" fill="#44403C"/>
  <rect x="392" y="168" width="10" height="34" rx="4" fill="#78716C"/>
  <!-- wheels -->
  <g id="wheel-rear">
    <circle cx="110" cy="210" r="30" fill="#1C1917"/>
    <circle cx="110" cy="210" r="17" fill="#D6D3D1"/>
    <circle cx="110" cy="210" r="7" fill="#E8590C"/>
    <g stroke="#1C1917" stroke-width="3"><line x1="110" y1="196" x2="110" y2="224"/><line x1="96" y1="210" x2="124" y2="210"/></g>
  </g>
  <g id="wheel-mid">
    <circle cx="320" cy="210" r="30" fill="#1C1917"/>
    <circle cx="320" cy="210" r="17" fill="#D6D3D1"/>
    <circle cx="320" cy="210" r="7" fill="#E8590C"/>
    <g stroke="#1C1917" stroke-width="3"><line x1="320" y1="196" x2="320" y2="224"/><line x1="306" y1="210" x2="334" y2="210"/></g>
  </g>
  <g id="wheel-front">
    <circle cx="520" cy="210" r="30" fill="#1C1917"/>
    <circle cx="520" cy="210" r="17" fill="#D6D3D1"/>
    <circle cx="520" cy="210" r="7" fill="#E8590C"/>
    <g stroke="#1C1917" stroke-width="3"><line x1="520" y1="196" x2="520" y2="224"/><line x1="506" y1="210" x2="534" y2="210"/></g>
  </g>
  <!-- speed lines -->
  <g stroke="#E8590C" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="8" y1="96" x2="26" y2="96"/><line x1="2" y1="124" x2="24" y2="124"/><line x1="10" y1="152" x2="26" y2="152"/>
  </g>
</svg>
